<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> БРЕНДЫ </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="brands">
        <h2 class="brands__title">Бренды</h2>

        <div class="brands__list swiper-wrapper">

            <div class="brands__item">
                <img src="./img/lenovo.1.svg" alt="Lenovo">
            </div>

            <div class="brands__item">
                <img src="./img/samsung.1.svg" alt="Samsung">
            </div>

            <div class="brands__item">
                <img src="./img/apple.2.svg" alt="Apple">
            </div>

            <div class="brands__item">
                <img src="./img/viewsonic 3.svg" alt="ViewSonic">
            </div>

            <div class="brands__item">
                <img src="./img/bosch 7.svg" alt="Bosch">
            </div>

            <div class="brands__item">
                <img src="./img/hp.8.svg" alt="HP">
            </div>

            <div class="brands__item">
                <img src="./img/acer.9.svg" alt="Acer">
            </div>

            <div class="brands__item">
                <img src="./img/sony .10.svg" alt="Sony">
            </div>

            <div class="brands__item">
                <img src="./img/lenovo .2..svg" alt="Lenovo">
            </div>

            <div class="brands__item">
                <img src="./img/samsung .2.svg" alt="Samsung">
            </div>

            <div class="brands__item">
                <img src="./img/apple.2.svg" alt="Apple">
            </div>

        </div>

        <div class="brands__pagination"></div>

        <button class="brands__button" type="button">
            Показать все
        </button>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
